version: "3.3"

services:
  nodeapp:
    build: .
    container_name: nodeapp
    expose:
      - "3000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nodeapp
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
